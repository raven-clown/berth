version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: ["kind/chore"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["kind/chore", "area/ci"]
    commit-message:
      prefix: ci
